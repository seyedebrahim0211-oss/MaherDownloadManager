name: Windows Installer - Build and Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Bundle JavaScript runtime for YouTube
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Copy Deno binary and set update repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin | Out-Null
          Copy-Item (Get-Command deno).Source assets/bin/deno.exe
          'RELEASE_REPOSITORY = "${{ github.repository }}"' | Set-Content -Path release_config.py -Encoding utf8
      - name: Build portable application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MaherDownloader --icon assets/maher.ico --add-data "assets;assets" --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --collect-all tkinterdnd2 app.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer using Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc installer/MaherDownloader.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = 'dist/installer/MaherDownloader-Setup.exe'
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  MaherDownloader-Setup.exe" | Set-Content -Path "$exe.sha256" -Encoding ascii
      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaherDownloader-Windows-Installer
          path: |
            dist/installer/MaherDownloader-Setup.exe
            dist/installer/MaherDownloader-Setup.exe.sha256
      - name: Publish installer on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @('dist/installer/MaherDownloader-Setup.exe', 'dist/installer/MaherDownloader-Setup.exe.sha256')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Maher Download Manager $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
