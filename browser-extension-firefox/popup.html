<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ماهر دانلود</title>
<style>body{font-family:Tahoma,sans-serif;background:#111d30;color:#f3f7fe;margin:0;width:350px;padding:20px;box-sizing:border-box}h2{margin:0;font-size:18px}p{color:#aac0d3;font-size:12px;line-height:1.8}input,button,select{box-sizing:border-box;width:100%;border:0;border-radius:8px;font-family:inherit;padding:10px;margin-top:9px}input,select{background:#25344c;color:#fff}button{background:#25b9b7;color:#08151c;cursor:pointer;font-weight:bold}#status{margin-top:12px;font-size:12px;color:#62d9a9;min-height:23px}.switch{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:14px}.switch input{width:auto;margin:0}.sub{background:#283951;color:#fff}</style></head><body>
<h2>◆ ماهر دانلود منیجر</h2><p>کد اتصال را از داخل برنامه ویندوز کپی کنید. این اتصال فقط روی رایانه خودتان کار می‌کند.</p>
<input id="token" type="password" dir="ltr" placeholder="کد اتصال از داخل برنامه" autocomplete="off" />
<button id="pair">ذخیره کد اتصال</button>
<label class="switch"><input id="auto" type="checkbox"/> انتقال خودکار دانلودهای جدید مرورگر</label>
<p>در حالت خودکار، دانلود مرورگر فقط پس از پذیرش در برنامه قطع می‌شود. موارد DRM و blob پشتیبانی نمی‌شوند.</p>
<input id="url" type="text" dir="ltr" placeholder="https://example.com/file.zip" />
<button id="send">افزودن لینک به صف دانلود</button>
<p>ویدیو یا جریان قابل شناسایی در این صفحه</p>
<select id="media"><option value="">در حال بررسی…</option></select>
<button id="sendMedia" class="sub">دانلود رسانه انتخاب‌شده</button>
<button id="sendPage" class="sub">بررسی ویدیوی صفحه فعلی</button>
<div id="status">در حال بررسی اتصال…</div>
<script src="popup.js"></script></body></html>
